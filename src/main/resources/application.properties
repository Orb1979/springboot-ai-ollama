spring.application.name=spring-ai

# Ollama runs here by default
spring.ai.ollama.base-url=http://localhost:11434

spring.ai.openai.api-key=${OPENAI_API_KEY}

# ollama models
# app.ai.conversation.model=qwen3.5:9b
# app.ai.conversation.provider=ollama
# app.ai.general.model=qwen3.5:9b
# app.ai.general.provider=ollama
# app.ai.vision.model=qwen3.5:9b
# app.ai.vision.provider=ollama
# app.ai.embedding.model=nomic-embed-text
# app.ai.embedding.provider=ollama

# openai models
app.ai.conversation.model=gpt-4o-mini
app.ai.conversation.provider=openai
app.ai.general.model=gpt-4o-mini
app.ai.general.provider=openai
app.ai.vision.model=gpt-4o-mini
app.ai.vision.provider=openai
app.ai.embedding.model=text-embedding-3-small
app.ai.embedding.provider=openai

# pgvector: dimensions must match the embedding model!!
# ollama, nomic-embed-text       > dimensions=768
# openai, text-embedding-3-small >  needs: dimensions=1536
# when changing embedding models, data needs to be re-indexed or wiped
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

# Minimum cosine similarity for semantic search hits. Raise to tighten results.
app.ai.search.similarity-threshold=0.2

# Disable Spring AI embedding auto-config; EmbeddingModelConfig supplies the bean.
spring.ai.model.embedding=none

# db
spring.datasource.url=jdbc:postgresql://localhost:5432/ai-invoice
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# flyway
logging.level.org.springframework.boot.autoconfigure.flyway=WARN
logging.level.org.flywaydb=WARN

# Controller -> Service -> Transaction ends (hibernate session is closed)
spring.jpa.open-in-view=false
