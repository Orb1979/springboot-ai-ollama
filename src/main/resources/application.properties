spring.application.name=spring-ai-ollama

# Ollama runs here by default
spring.ai.ollama.base-url=http://localhost:11434

# application.properties > chatClient > chatModel > Ollama > Ollama chat model
app.ai.ollama.general-model=qwen3.5:9b
app.ai.ollama.conversation-model=qwen3.5:9b
app.ai.ollama.vision-model=llama3.2-vision

# db
spring.datasource.url=jdbc:postgresql://localhost:5432/ai-invoice
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# flyway
logging.level.org.springframework.boot.autoconfigure.flyway=WARN
logging.level.org.flywaydb=WARN

# Controller -> Service -> Transaction ends (hibernate session is closed)
spring.jpa.open-in-view=false
